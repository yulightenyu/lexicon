<style>
  :root{
    --ink:#0f1c24; --ink2:#0b151b;
    --card:#17282f; --card2:#1c333b;
    --brass:#c9a24b; --brass-dim:rgba(201,162,75,.34);
    --cream:#f1e9d6; --slate:#8aa0a5; --green:#6fae8f;
    --serif:Georgia,"Times New Roman","Noto Serif",serif;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    --mono:"SF Mono","Roboto Mono",ui-monospace,monospace;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    background:radial-gradient(120% 90% at 50% -10%, #16252e 0%, var(--ink) 55%, var(--ink2) 100%);
    color:var(--cream); font-family:var(--sans);
    min-height:100%; display:flex; flex-direction:column;
    padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  }
  #app{flex:1; width:100%; max-width:480px; margin:0 auto; display:flex; flex-direction:column; padding:18px 20px 22px;}
  .top{display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;}
  .brand{font-family:var(--mono); font-size:11px; letter-spacing:3px; color:var(--brass); text-transform:uppercase;}
  .streak{font-family:var(--mono); font-size:12px; color:var(--slate);}
  .streak b{color:var(--cream);}
  .stage{flex:1; display:flex; align-items:center; perspective:1600px; padding:6px 0;}
  .card{
    position:relative; width:100%; min-height:62vh; cursor:pointer;
    transform-style:preserve-3d; transition:transform .55s cubic-bezier(.4,.1,.2,1);
  }
  .card.flipped{transform:rotateY(180deg);}
  .face{
    position:absolute; inset:0; backface-visibility:hidden; -webkit-backface-visibility:hidden;
    background:linear-gradient(155deg, var(--card2), var(--card));
    border-radius:14px; padding:30px 26px;
    box-shadow:0 18px 50px -18px rgba(0,0,0,.7), inset 0 0 0 1px var(--brass-dim);
    display:flex; flex-direction:column; overflow:hidden;
  }
  .face::before{
    content:""; position:absolute; inset:11px; border:1px solid var(--brass-dim); border-radius:7px; pointer-events:none;
  }
  .back{transform:rotateY(180deg);}
  .eyebrow{font-family:var(--mono); font-size:10.5px; letter-spacing:2.5px; color:var(--brass); text-transform:uppercase; display:flex; justify-content:space-between;}
  .eyebrow .date{color:var(--slate); letter-spacing:1.5px;}
  .front .word{font-family:var(--serif); font-weight:600; line-height:1.02; color:var(--cream);
    font-size:clamp(40px,12vw,58px); margin-top:auto; letter-spacing:-.5px; word-break:break-word;}
  .front .ipa{font-family:var(--mono); font-size:16px; color:var(--slate); margin-top:14px;}
  .front .pos{font-family:var(--serif); font-style:italic; font-size:17px; color:var(--brass); margin-top:6px;}
  .front .hint{margin-top:auto; font-size:12.5px; color:var(--slate); letter-spacing:.4px; opacity:.8;}
  .back .word-sm{font-family:var(--serif); font-size:24px; color:var(--cream); margin-top:10px; margin-bottom:2px;}
  .back .scrollable{flex:1; overflow-y:auto; margin-top:8px; -webkit-overflow-scrolling:touch;}
  .label{font-family:var(--mono); font-size:9.5px; letter-spacing:2px; color:var(--brass); text-transform:uppercase; margin:18px 0 7px;}
  .def{font-size:16.5px; line-height:1.55; color:var(--cream);}
  .roots{display:flex; flex-wrap:wrap; gap:7px; align-items:stretch;}
  .seg{background:rgba(201,162,75,.08); border:1px solid var(--brass-dim); border-radius:7px; padding:8px 11px; min-width:54px;}
  .seg .p{font-family:var(--serif); font-size:18px; color:var(--brass); line-height:1;}
  .seg .g{font-size:11px; color:var(--slate); margin-top:5px; line-height:1.3;}
  .origin{font-size:14px; line-height:1.5; color:var(--slate); font-style:italic;}
  .ex{font-family:var(--serif); font-size:16px; line-height:1.6; color:var(--cream); border-left:2px solid var(--brass); padding-left:13px; opacity:.95;}
  .controls{display:flex; gap:10px; margin-top:16px;}
  button{font-family:var(--sans); font-size:15px; border:none; border-radius:10px; padding:14px 0; flex:1; font-weight:600; letter-spacing:.5px;}
  button:active{transform:scale(.97);}
  .btn-know{background:var(--brass); color:var(--ink);}
  .btn-know.done{background:var(--green); color:var(--ink2);}
  .btn-ghost{background:transparent; color:var(--cream); box-shadow:inset 0 0 0 1px var(--brass-dim);}
  .nav{display:flex; justify-content:space-between; align-items:center; margin-top:14px; font-family:var(--mono); font-size:12px; color:var(--slate);}
  .nav button{flex:none; background:none; box-shadow:none; color:var(--slate); padding:8px 12px; font-family:var(--mono); font-size:13px;}
  .nav .today-btn{color:var(--brass);}
  .nav .counter{letter-spacing:1px;}
  .notify{margin-top:12px; font-size:12.5px; color:var(--slate); text-align:center; line-height:1.6;}
  .notify a{color:var(--brass); text-decoration:underline; cursor:pointer;}
  .scrollable::-webkit-scrollbar{width:0;}
  @media (prefers-reduced-motion:reduce){ .card{transition:none;} }
</style>
</head>
<body>
<div id="app">
  <div class="top">
    <span class="brand">Lexicon · 每日一词</span>
    <span class="streak" id="streak">🔥 <b>0</b> 天</span>
  </div>
  <div class="stage">
    <div class="card" id="card">
      <div class="face front">
        <div class="eyebrow"><span id="wordno">WORD</span><span class="date" id="date"></span></div>
        <div class="word" id="word">—</div>
        <div class="ipa" id="ipa"></div>
        <div class="pos" id="pos"></div>
        <div class="hint">轻点卡片查看释义 ·  先试着回忆</div>
      </div>
      <div class="face back">
        <div class="eyebrow"><span>Entry</span><span class="date" id="date2"></span></div>
        <div class="word-sm" id="word2"></div>
        <div class="scrollable">
          <div class="label">释义</div>
          <div class="def" id="def"></div>
          <div class="label" id="rootlabel">词根拆解</div>
          <div class="roots" id="roots"></div>
          <div class="label">例句</div>
          <div class="ex" id="ex"></div>
        </div>
      </div>
    </div>
  </div>
  <div class="controls">
    <button class="btn-know" id="know">记住了</button>
    <button class="btn-ghost" id="flip">翻面</button>
  </div>
  <div class="nav">
    <button id="prev">‹ 前一个</button>
    <span class="counter" id="counter"></span>
    <button id="next">后一个 ›</button>
  </div>
  <div class="nav" style="justify-content:center;margin-top:2px;">
    <button class="today-btn" id="todaybtn">回到今天</button>
  </div>
  <div class="notify" id="notify"></div>
</div>

const $=id=>document.getElementById(id);
const EPOCH=Date.UTC(2024,0,1)/86400000|0;
function todayIndex(){
  const now=new Date();
  const days=(Date.UTC(now.getFullYear(),now.getMonth(),now.getDate())/86400000|0)-EPOCH;
  return ((days%DECK.length)+DECK.length)%DECK.length;
}
function todayKey(){const n=new Date();return n.getFullYear()+'-'+(n.getMonth()+1)+'-'+n.getDate();}

let store={known:{},streak:0,lastDay:null};
try{const s=localStorage.getItem('lexicon');if(s)store=Object.assign(store,JSON.parse(s));}catch(e){}
function save(){try{localStorage.setItem('lexicon',JSON.stringify(store));}catch(e){}}

(function updateStreak(){
  const tk=todayKey();
  if(store.lastDay!==tk){
    const y=new Date();y.setDate(y.getDate()-1);
    const yk=y.getFullYear()+'-'+(y.getMonth()+1)+'-'+y.getDate();
    store.streak=(store.lastDay===yk)?store.streak+1:1;
    store.lastDay=tk; save();
  }
})();

let idx=todayIndex();

function render(){
  const e=DECK[idx];
  $('word').textContent=e.w;
  $('word2').textContent=e.w;
  $('ipa').textContent=e.ipa;
  $('pos').textContent=e.pos;
  $('def').textContent=e.def;
  $('ex').textContent=e.ex;
  $('wordno').textContent='No. '+String(idx+1).padStart(2,'0');
  const d=new Date();
  $('date').textContent=$('date2').textContent=`${d.getMonth()+1}月${d.getDate()}日`;
  $('counter').textContent=`${idx+1} / ${DECK.length}`;
  $('streak').innerHTML=`🔥 <b>${store.streak}</b> 天 · 已记 ${Object.keys(store.known).length}`;
  const rl=$('rootlabel'), rc=$('roots');
  rc.innerHTML='';
  if(e.roots){
    rl.textContent='词根拆解'; rl.style.display='';
    e.roots.forEach(r=>{
      const s=document.createElement('div');s.className='seg';
      s.innerHTML=`<div class="p">${r.p}</div><div class="g">${r.g}</div>`;
      rc.appendChild(s);
    });
  }else if(e.origin){
    rl.textContent='词源'; rl.style.display='';
    const o=document.createElement('div');o.className='origin';o.textContent=e.origin;
    rc.appendChild(o);
  }else{rl.style.display='none';}
  const kb=$('know');
  if(store.known[e.w]){kb.textContent='✓ 已记住';kb.classList.add('done');}
  else{kb.textContent='记住了';kb.classList.remove('done');}
  $('card').classList.remove('flipped');
}

function flip(){$('card').classList.toggle('flipped');}
$('card').addEventListener('click',flip);
$('flip').addEventListener('click',e=>{e.stopPropagation();flip();});
$('know').addEventListener('click',e=>{
  e.stopPropagation();
  const w=DECK[idx].w;
  if(store.known[w])delete store.known[w];else store.known[w]=true;
  save();render();
  if(navigator.vibrate)navigator.vibrate(20);
});
$('prev').addEventListener('click',()=>{idx=(idx-1+DECK.length)%DECK.length;render();});
$('next').addEventListener('click',()=>{idx=(idx+1)%DECK.length;render();});
$('todaybtn').addEventListener('click',()=>{idx=todayIndex();render();});

function setupNotify(){
  const n=$('notify');
  if(!('Notification'in window)){n.textContent='此浏览器不支持通知。';return;}
  function paint(){
    if(Notification.permission==='granted'){
      n.innerHTML='每日提醒已开启 ·  打开 App 时会推送当天的词。';
      maybeNotify();
    }else if(Notification.permission==='denied'){
      n.innerHTML='通知被拒绝。可在浏览器设置里重新允许，或用系统闹钟提醒。';
    }else{
      n.innerHTML='想每天被提醒？ <a id="ask">开启通知</a>';
      const a=$('ask');if(a)a.onclick=()=>Notification.requestPermission().then(paint);
    }
  }
  paint();
}
function maybeNotify(){
  const tk=todayKey();
  if(store.notifiedDay===tk)return;
  const e=DECK[todayIndex()];
  try{
    new Notification('今天的词：'+e.w,{body:e.def,tag:'daily-word',icon:''});
    store.notifiedDay=tk;save();
  }catch(err){}
}
setupNotify();

if('serviceWorker'in navigator){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('service-worker.js').catch(()=>{});
  });
}

render();
</script>
</body>
</html>
